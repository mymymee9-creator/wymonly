<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부스 배치도</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root{
      --paper:#f7f5ef;
      --card:#ffffff;
      --navy:#173b72;
      --text:#111111;
      --muted:#77736f;
      --line:#d4d1cb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;}
    body{
      background:var(--paper);
      color:var(--text);
      font-family:Pretendard, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    header{
      height:92px;
      border-bottom:1px solid #d1cec8;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      padding:0 44px 25px;
    }
    .eyebrow{
      margin:0 0 6px;
      font-size:11px;
      line-height:1;
      color:#77736f;
      font-weight:400;
    }
    h1{
      margin:0;
      font-size:25px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.05em;
    }
    .date{
      font-size:11px;
      line-height:1;
      color:#77736f;
      font-weight:400;
    }

    main{padding:29px 44px 48px;}
    .guide{
      margin:0 0 34px;
      text-align:center;
      font-size:11px;
      line-height:1;
      font-weight:500;
      letter-spacing:-.035em;
    }
    .booth-grid{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:17px 8px;
    }
    .booth{
      height:73px;
      min-width:0;
      background:var(--card);
      border:1px solid #d0d0d0;
      border-radius:6px;
      padding:10px 7px 7px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      overflow:hidden;
      transition:background-color .15s ease, border-color .15s ease;
    }
    .booth:hover,.booth.active{
      transform:none;
      background:#f3ead7;
      border-color:var(--navy);
    }
    .number,.modal-number{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:16px;
      padding:0 6px;
      border-radius:5px;
      background:var(--navy);
      color:#fff;
      font-size:6.5px;
      line-height:1;
      font-weight:500;
      letter-spacing:-.03em;
    }
    .booth .number{margin-bottom:4px;}
    .booth h2{
      margin:0 0 2px;
      font-size:10px;
      line-height:1.05;
      font-weight:800;
      letter-spacing:-.055em;
    }
    .booth p{
      margin:0 0 4px;
      font-size:6.5px;
      line-height:1;
      color:#111;
      letter-spacing:-.04em;
    }
    .heart{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:var(--navy);
      font-size:6px;
      line-height:1;
      font-weight:700;
      letter-spacing:-.045em;
    }

    .backdrop{
      position:fixed;
      inset:0;
      z-index:20;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(247,245,239,.78);
      backdrop-filter:blur(3px);
    }
    .backdrop.open{display:flex}

    .modal{
      position:relative;
      width:min(1320px,calc(100vw - 40px));
      height:min(700px,calc(100vh - 40px));
      overflow:hidden;
      background:rgba(247,245,239,.97);
      border:1px solid #bdbab4;
      border-radius:17px;
      padding:25px 32px 30px;
      box-shadow:none;
    }
    .close{
      position:absolute;
      top:24px;
      right:23px;
      width:40px;
      height:40px;
      padding:0;
      border:1px solid #d0cdc7;
      border-radius:50%;
      background:transparent;
      color:#aaa7a1;
      font-family:Arial,sans-serif;
      font-size:25px;
      font-weight:200;
      line-height:36px;
      cursor:pointer;
    }
    .modal-number{height:31px;padding:0 10px;border-radius:6px;font-size:15px;font-weight:600;margin-bottom:10px;}
    .modal h2{
      margin:0 0 10px;
      font-size:29px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.065em;
    }
    .modal-sub{
      margin:0 0 28px;
      color:var(--navy);
      font-size:9px;
      line-height:1;
      font-weight:700;
      letter-spacing:-.045em;
    }
    .tweet-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:22px;
    }
    .tweet-slot{
      height:500px;
      min-width:0;
      background:#fff;
      border:1px solid #d3d3d3;
      border-radius:10px;
      padding:8px;
      overflow:hidden;
    }
    .tweet-preview{
      width:100%;
      height:100%;
      overflow:hidden;
      transform:none;
      transform-origin:top left;
    }
    .tweet-preview .twitter-tweet{
      margin:0!important;
      max-width:none!important;
      width:100%!important;
    }
    .tweet-preview iframe{
      max-width:none!important;
      min-width:0!important;
      width:100%!important;
    }
    .empty-post{width:100%;height:100%;}
    .hint{display:none}

    @media(max-width:900px){
      header{padding-left:28px;padding-right:28px}
      main{padding-left:28px;padding-right:28px}
      .booth-grid{grid-template-columns:repeat(6,minmax(0,1fr));}
    }
    @media(max-width:650px){
      header{height:82px;padding:0 20px 21px}
      main{padding:25px 20px 35px}
      .guide{margin-bottom:25px}
      .booth-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 7px}
      .modal{height:auto;max-height:calc(100vh - 30px);padding:22px 18px 20px}
      .tweet-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .tweet-slot{height:420px}
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">2026 와얌여고 ~ 카레 연구 클럽 ~</div>
      <h1>부스 배치도</h1>
    </div>
    <div class="date">26.10.11 SEOUL</div>
  </header>

  <main>
    <p class="guide">클릭 시 각 부스 별 인포 게시물을 확인 할 수 있습니다.</p>
    <section class="booth-grid" id="boothGrid"></section>
  </main>

  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close" id="closeBtn" aria-label="닫기">×</button>
      <div class="modal-number" id="modalNumber">부스 번호</div>
      <h2 id="modalTitle">부스 명</h2>
      <p class="modal-sub">♥ 쿄사토 고바호시 메다니카</p>
      <div class="tweet-grid" id="tweetGrid"></div>
    </div>
  </div>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    const boothGrid = document.getElementById('boothGrid');
    const backdrop = document.getElementById('backdrop');
    const tweetGrid = document.getElementById('tweetGrid');
    const modalNumber = document.getElementById('modalNumber');
    const modalTitle = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('closeBtn');

    const booths = Array.from({length:36}, (_,i) => ({
      number: String(i+1).padStart(2,'0'),
      name: i === 0 ? '행운의 사슴벌레' : i === 1 ? '데이트하러 가자' : i === 2 ? '뜨거운 커피랑 레몬티' : '부스 명',
      participant: i === 0 ? '척척' : i === 1 ? '하현' : i === 2 ? 'ESR' : '부스 참가자',
      comment: '쿄사토 고바호시 메다니카',
      posts: i === 0
        ? ['https://x.com/3_3o_o__/status/2096554033079316667', null, null, null]
        : [null, null, null, null]
    }));

    booths.forEach((booth, index) => {
      const card = document.createElement('article');
      card.className = 'booth';
      card.innerHTML = `
        <div class="number">부스 번호</div>
        <h2>${booth.name}</h2>
        <p>${booth.participant}</p>
        <div class="heart">♥ 쿄사토 고바호시 메다니카</div>
      `;
      card.addEventListener('click', () => openBooth(index));
      boothGrid.appendChild(card);
    });

    function openBooth(index){
      const booth = booths[index];
      modalNumber.textContent = '부스 번호';
      modalTitle.textContent = booth.name;
      tweetGrid.innerHTML = '';

      booth.posts.forEach((url) => {
        const slot = document.createElement('div');
        slot.className = 'tweet-slot';

        if (url) {
          const preview = document.createElement('div');
          preview.className = 'tweet-preview';
          const block = document.createElement('blockquote');
          block.className = 'twitter-tweet';
          block.innerHTML = `<a href="${url}" target="_blank" rel="noopener">X 게시물 보기</a>`;
          preview.appendChild(block);
          slot.appendChild(preview);
          tweetGrid.appendChild(slot);

          if (window.twttr && window.twttr.widgets) {
            window.twttr.widgets.load(preview);
          } else {
            setTimeout(() => window.twttr?.widgets?.load(preview), 800);
          }
        } else {
          slot.innerHTML = '<div class="empty-post"></div>';
          tweetGrid.appendChild(slot);
        }
      });
      backdrop.classList.add('open');
    }

    function closeModal(){ backdrop.classList.remove('open'); }
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
